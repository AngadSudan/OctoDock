version: "3.8"

services:
  octodock-backend:
    image: angadsudan/octodock-backend
    container_name: backend
    ports:
      - 8000:8000
    env_file:
      - ./apps/server/.env
  octodock-frontend:
    image: angadsudan/octodock-frontend
    container_name: frontend
    ports:
      - 5173:5173
    env_file:
      - ./apps/client/.env
